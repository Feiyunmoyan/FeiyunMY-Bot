# ruff 配置：https://docs.astral.sh/ruff/
target-version = "py313"
line-length = 120

exclude = [
    ".git", ".venv", "venv", "data", "webui", "docs",
    "__pycache__", "*.bat",
]

[lint]
# F   = pyflakes：F821 未定义名 / F823 未绑定局部变量 / F811 重复定义 / F401 未使用 import
# E9  = 语法与运行时错误
select = ["F", "E9"]

# F841 unused-variable 暂留 ignore：
# 现存 8 处历史遗留的空赋值（now / today_str / hour / tools_cfg / before / meta / usage / params），
# 逐个删除需要确认是否带副作用（ruff 将其标记为 unsafe fix），
# 清理完即把 F841 从这里移出。
ignore = ["F841"]

[lint.per-file-ignores]
# admin.py 按约定暂不重构（99 个接口，风险高），其内部 5 处函数级未使用 import 保留原状
"api/admin.py" = ["F401"]

[lint.isort]
known-first-party = [
    "api", "agent", "memory", "tools", "provider", "workspace",
    "active_engine", "knowledge", "skills", "persona", "mcp", "db", "utils",
]
